# --- H2 file-based database (replaces MySQL from the original course project) ---
spring.datasource.url=jdbc:h2:file:./data/ecommercedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Hibernate creates the schema first, then data.sql seeds it
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Spring Data REST ---
spring.data.rest.base-path=/api

# --- CORS ---
allowed.origins=http://localhost:4200

# --- Local JWT auth (replaces Okta/OIDC) ---
app.jwt.secret=change-this-local-dev-secret-key-please-1234567890
app.jwt.expiration-ms=86400000

server.port=8080
