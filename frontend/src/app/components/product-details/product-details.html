@if (product(); as p) {
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-5">
        <img [src]="p.imageUrl" [alt]="p.name" class="img-fluid" />
      </div>
      <div class="col-md-7">
        <h2>{{ p.name }}</h2>
        <p class="text-muted">{{ p.description }}</p>
        <h4>{{ p.unitPrice | currency }}</h4>
        <p>{{ p.unitsInStock > 0 ? 'In stock' : 'Out of stock' }}</p>
        <button class="btn btn-primary" [disabled]="p.unitsInStock <= 0" (click)="addToCart()">
          Add to Cart
        </button>
      </div>
    </div>
  </div>
}
