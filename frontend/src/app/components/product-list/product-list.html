<div class="container mt-4">
  <div class="row">
    @for (product of products(); track product.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <a [routerLink]="['/products', product.id]">
            <img [src]="product.imageUrl" class="card-img-top" [alt]="product.name" style="height: 200px; object-fit: contain;" />
          </a>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">
              <a [routerLink]="['/products', product.id]" class="text-decoration-none">{{ product.name }}</a>
            </h5>
            <p class="card-text text-muted small flex-grow-1">{{ product.description }}</p>
            <p class="fw-bold">{{ product.unitPrice | currency }}</p>
            <button class="btn btn-primary mt-auto" (click)="addToCart(product)">Add to Cart</button>
          </div>
        </div>
      </div>
    } @empty {
      <p class="text-center">No products found.</p>
    }
  </div>

  @if (totalElements() > 0) {
    <div class="d-flex justify-content-between align-items-center mt-3">
      <div>
        <label class="me-2">Page size:</label>
        <select class="form-select d-inline-block w-auto" [value]="pageSize()" (change)="updatePageSize($any($event.target).value)">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </div>

      <nav>
        <ul class="pagination mb-0">
          <li class="page-item" [class.disabled]="pageNumber() === 0">
            <button class="page-link" (click)="goToPage(pageNumber() - 1)">Previous</button>
          </li>
          @for (page of pageNumbers(); track page) {
            <li class="page-item" [class.active]="page === pageNumber()">
              <button class="page-link" (click)="goToPage(page)">{{ page + 1 }}</button>
            </li>
          }
          <li class="page-item" [class.disabled]="pageNumber() >= totalPages() - 1">
            <button class="page-link" (click)="goToPage(pageNumber() + 1)">Next</button>
          </li>
        </ul>
      </nav>

      <div>{{ totalElements() }} results</div>
    </div>
  }
</div>
